name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 */120 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}" \
            "https://iqilwonehfptkqhlwkcf.supabase.co/rest/v1/" || true
          echo "Supabase pinged!"
